[package]
name = "zedtest"
version = "0.1.0"
edition = "2024"
description = "Log ingestion and parser engine with TUI"
license = "MIT"
authors = ["Siddharth Tamang <tamangsiddharth12@gmai.com>"]
repository = "https://github.com/tamangsiddharth12/zedtest"
readme = "README.md"
name = "logcli"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
csv = "1.4.0"
indicatif = "0.18.6"
lru = "0.19.0"
memchr = "2.8.3"
memmap2 = "0.9.12"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
